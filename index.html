<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Countdown</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    height: 100vh;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* Lightning flash */
  .flash {
    position: fixed;
    inset: 0;
    background: red;
    opacity: 0;
    pointer-events: none;
    animation: flash 8s infinite;
  }

  @keyframes flash {
    0%, 96%, 100% { opacity: 0; }
    97% { opacity: 0.15; }
    98% { opacity: 0.4; }
    99% { opacity: 0.1; }
  }

  #timer {
    font-family: 'Bebas Neue', sans-serif;
    color: red;
    font-size: clamp(2.5rem, 8vw, 6rem);
    letter-spacing: 0.3em;
    text-shadow:
      0 0 10px red,
      0 0 25px darkred,
      0 0 45px crimson;
    animation: flicker 3s infinite;
    text-align: center;
    padding: 1rem;
    max-width: 90vw;
  }

  @keyframes flicker {
    0% { opacity: 1; }
    45% { opacity: 0.85; }
    50% { opacity: 0.6; }
    55% { opacity: 0.9; }
    100% { opacity: 1; }
  }
</style>
</head>

<body>

<div class="flash"></div>
<div id="timer">LOADING</div>

<script>
  const endDate = new Date("January 17, 2026 00:00:00").getTime();
  const timer = document.getElementById("timer");

  function update() {
    const now = Date.now();
    const diff = endDate - now;

    if (diff <= 0) {
      timer.style.fontSize = "clamp(1.5rem, 6vw, 3rem)";
      timer.textContent =
        "You really thought there would be a stranger things ep 9? yo bumahh";
      return;
    }

    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff / 3600000) % 24);
    const m = Math.floor((diff / 60000) % 60);
    const s = Math.floor((diff / 1000) % 60);

    timer.textContent =
      `${d}:${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }

  update();
  setInterval(update, 1000);
</script>

</body>
</html>
